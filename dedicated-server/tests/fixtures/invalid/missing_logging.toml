listen = "10.0.0.1:7000"
max_label_bytes = 64
max_frame_bytes = 1048576

[identity]
label = "dedicated-1"
encryption_private_key = "/etc/homecloud/dedicated/encryption.key"
signing_private_key = "/etc/homecloud/dedicated/signing.key"

[heartbeat]
interval_ms = 1000
timeout_ms = 500
miss_threshold = 3

[password]
memory_kib = 8
iterations = 1
parallelism = 1
salt_length_bytes = 16

