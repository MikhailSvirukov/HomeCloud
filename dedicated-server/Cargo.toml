[package]
name = "dedicated-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dedicated-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
