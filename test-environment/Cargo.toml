[workspace]
resolver = "3"
members = [
    "crates/harness-core",
    "crates/harness-docker",
    "crates/harness-scenario",
    "crates/harness-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MikhailSvirukov/HomeCloud"
publish = false

[workspace.dependencies]
bollard = "0.21"
futures-util = "0.3"
harness-core = { path = "crates/harness-core" }
harness-docker = { path = "crates/harness-docker" }
harness-test-support = { path = "crates/harness-test-support" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time"] }
