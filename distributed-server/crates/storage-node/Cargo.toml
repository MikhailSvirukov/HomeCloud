[package]
name = "storage-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
name = "storage_node"
path = "src/lib.rs"

[[bin]]
name = "storage-node"
path = "src/main.rs"

[dependencies]
ciborium = "0.2"
ed25519-dalek = "2"
getrandom = "0.4"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
num_enum = "0.7"
openraft = { version = "=0.9.25", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "test-util"] }
