[package]
name = "storage-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
name = "storage_node"
path = "src/lib.rs"

[[bin]]
name = "storage-node"
path = "src/main.rs"

[dependencies]
num_enum = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"] }
