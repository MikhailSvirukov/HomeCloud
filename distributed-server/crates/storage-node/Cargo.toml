[package]
name = "storage-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
name = "storage_node"
path = "src/lib.rs"

[[bin]]
name = "storage-node"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
num_enum = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
