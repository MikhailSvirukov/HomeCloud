[package]
name = "storage-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[lints]
workspace = true

[lib]
name = "storage_node"
path = "src/lib.rs"

[[bin]]
name = "storage-node"
path = "src/main.rs"

[dependencies]
ciborium = "0.2"
ed25519-dalek = "2"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
num_enum = "0.7"
openraft = { version = "=0.9.25", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"] }
