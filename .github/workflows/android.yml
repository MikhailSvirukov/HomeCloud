name: Android CI

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-check:
    name: Android area check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Cache Gradle distribution
        uses: actions/cache@v6
        with:
          path: ~/.cache/homecloud-gradle
          key: ${{ runner.os }}-gradle-dist-${{ hashFiles('android/gradle/libs.versions.toml', 'android/ci/check.sh') }}
          restore-keys: |
            ${{ runner.os }}-gradle-dist-

      - name: Cache Gradle user home
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-home-${{ hashFiles('android/gradle/libs.versions.toml', 'android/ci/check.sh') }}
          restore-keys: |
            ${{ runner.os }}-gradle-home-

      - name: Run Android area check
        run: bash android/ci/check.sh
