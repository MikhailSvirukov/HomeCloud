name: dedicated-server

on:
  push:
    branches: [main]
    paths:
      - dedicated-server/**
      - .github/workflows/dedicated-server.yml
      - AGENTS.md
      - README.md
      - docs/**
      - contracts/**
      - .opencode/**
      - compose.yaml
      - compose.test-engine.yaml
      - Dockerfile.agent
  pull_request:
    paths:
      - dedicated-server/**
      - .github/workflows/dedicated-server.yml
      - AGENTS.md
      - README.md
      - docs/**
      - contracts/**
      - .opencode/**
      - compose.yaml
      - compose.test-engine.yaml
      - Dockerfile.agent

permissions:
  contents: read

concurrency:
  group: dedicated-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Area checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dedicated-server
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dedicated-server
      - name: Run the area checks
        run: bash scripts/ci.sh

  image:
    name: Runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Validate the Compose configuration
        env:
          # compose.yaml requires these for every service; only their presence matters here.
          DEDICATED_SERVER_CONFIG_DIR: ${{ runner.temp }}/dedicated-server-config
          GITHUB_MCP_TOKEN: ci-placeholder
          DEEPSEEK_API_KEY: ci-placeholder
        run: docker compose config --quiet
      - name: Build the runtime image
        run: docker build -f dedicated-server/Dockerfile -t homecloud-dedicated-server:ci .
      - name: Smoke-run the runtime image
        run: |
          config_dir="$(mktemp -d "$RUNNER_TEMP/dedicated-server-smoke.XXXXXX")"
          log_dir="$(mktemp -d "$RUNNER_TEMP/dedicated-server-logs.XXXXXX")"

          mkdir -p "$config_dir/keys"
          cp dedicated-server/config/dedicated-server.example.toml "$config_dir/dedicated-server.toml"
          openssl rand -out "$config_dir/keys/encryption.key" 32
          openssl rand -out "$config_dir/keys/signing.key" 32
          chmod 700 "$config_dir" "$config_dir/keys"
          chmod 600 "$config_dir/dedicated-server.toml" \
            "$config_dir/keys/encryption.key" \
            "$config_dir/keys/signing.key"
          sudo chown -R 10001:10001 "$config_dir" "$log_dir"
          sudo chmod 0755 "$log_dir"

          container="dedicated-server-smoke-$$"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            sudo rm -rf "$config_dir" "$log_dir"
          }
          trap cleanup EXIT

          docker run -d --name "$container" --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$config_dir:/etc/homecloud:ro" \
            -v "$log_dir:/var/log/homecloud:rw" \
            homecloud-dedicated-server:ci >/dev/null

          for _ in $(seq 1 60); do
            grep -Fq '"event":"startup"' "$log_dir/dedicated-server.log" 2>/dev/null && break
            sleep 1
          done
          if ! grep -Fq '"event":"startup"' "$log_dir/dedicated-server.log" 2>/dev/null; then
            echo 'runtime image did not emit an "event":"startup" record in its log file' >&2
            cat "$log_dir/dedicated-server.log" >&2 || true
            docker logs "$container" >&2 || true
            exit 1
          fi

          docker stop --time 15 "$container" >/dev/null
          status=$(docker inspect -f '{{.State.ExitCode}}' "$container")
          if [ "$status" -ne 0 ]; then
            echo "runtime image exited with status $status" >&2
            cat "$log_dir/dedicated-server.log" >&2 || true
            exit 1
          fi
          if ! grep -Fq '"event":"shutdown"' "$log_dir/dedicated-server.log"; then
            echo 'runtime image did not emit an "event":"shutdown" record after SIGTERM' >&2
            cat "$log_dir/dedicated-server.log" >&2 || true
            exit 1
          fi
